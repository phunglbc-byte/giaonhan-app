<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f6feb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Giao Nhận">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231f6feb'/%3E%3Cpath d='M3 7h10v8H3zM13 10h3l2 2v3h-5z' fill='white'/%3E%3Ccircle cx='6.5' cy='16.5' r='1.6' fill='white'/%3E%3Ccircle cx='15.5' cy='16.5' r='1.6' fill='white'/%3E%3C/svg%3E">
<title>Quản lý Giao Nhận (bản máy tính)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --ink:#1b2330; --muted:#6b7686; --line:#e3e7ee;
  --pri:#1f6feb; --pri-soft:#e8f0fe; --ok:#1a8f5a; --ok-soft:#e5f5ed; --warn:#b7791f; --warn-soft:#fdf3e1;
  --bad:#c53030; --bad-soft:#fdeaea; --info:#5a4fcf; --info-soft:#eeecfb;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f141b; --card:#18202b; --ink:#e6ebf2; --muted:#94a0b2; --line:#2a3442;
  --pri:#5b9bff; --pri-soft:#1c2b44; --ok:#4cc38a; --ok-soft:#163327; --warn:#e0a84a; --warn-soft:#3a2d15;
  --bad:#f07070; --bad-soft:#3d1c1c; --info:#a69cff; --info-soft:#262148;}
}
*{box-sizing:border-box}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.hwrap{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand svg{color:var(--pri)}
nav{max-width:1200px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
nav button{border:0;background:none;padding:10px 14px;font:inherit;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
nav button.on{color:var(--pri);border-bottom-color:var(--pri)}
main{max-width:1200px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--muted);font-size:12px;margin-top:2px}
h2{font-size:16px;margin:0 0 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri-soft);border-color:var(--pri)}
textarea{width:100%;resize:vertical}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--pri)}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.d{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.02em;background:var(--bg)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--pri-soft)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.tw table th:first-child,.tw table td:first-child{padding-left:14px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.t-wait{background:var(--warn-soft);color:var(--warn)} .t-go{background:var(--info-soft);color:var(--info)}
.t-done{background:var(--ok-soft);color:var(--ok)} .t-cancel{background:var(--bad-soft);color:var(--bad)}
.muted{color:var(--muted)} .small{font-size:12.5px}
.empty{padding:36px;text-align:center;color:var(--muted)}
.banner{padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:13px}
.banner.w{background:var(--warn-soft);color:var(--warn)}
.bars{display:flex;align-items:flex-end;gap:3px;height:140px;padding-top:6px}
.bars div{flex:1;background:var(--pri);border-radius:3px 3px 0 0;min-height:2px;position:relative;opacity:.85}
.bars div:hover{opacity:1}
.bars div:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:3px 7px;border-radius:5px;font-size:11px;white-space:nowrap;margin-bottom:4px;z-index:2}
.axis{display:flex;gap:3px;font-size:10px;color:var(--muted);margin-top:4px}
.axis span{flex:1;text-align:center}
.two{grid-template-columns:2fr 1fr}
@media(max-width:820px){.two{grid-template-columns:1fr}}

/* modal */
.mask{position:fixed;inset:0;background:rgba(10,15,25,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:30px 12px}
.mask.on{display:flex}
.modal{background:var(--card);border-radius:14px;max-width:760px;width:100%;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{margin:0 0 14px;font-size:17px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.f label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;font-weight:500}
.f input,.f select{width:100%}
.legs .leg{display:grid;grid-template-columns:28px 1fr 90px 58px 34px;gap:6px;align-items:center;margin-bottom:6px}
.legs .num{width:24px;height:24px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.calc{background:var(--bg);border-radius:10px;padding:12px 14px;margin-top:14px}
.calc .big{font-size:20px;font-weight:700;color:var(--pri)}
.gm{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--pri);font-weight:600;border:1px solid var(--pri);border-radius:8px;padding:7px 12px;background:var(--pri-soft)}
.gm.off{opacity:.45;pointer-events:none}
.gm.sm{padding:4px 6px;font-size:12px;justify-content:center}
.mapbox{border:1px dashed var(--line);border-radius:10px;padding:12px;margin-top:10px}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.tiers .tier{display:grid;grid-template-columns:1fr 1fr 1.3fr 34px;gap:8px;margin-bottom:6px;align-items:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;z-index:99;opacity:0;transition:.25s;pointer-events:none;font-size:13px}
.toast.on{opacity:1}
.pay-in{width:100px;text-align:right}
.sec{margin-top:18px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
/* ===== Điện thoại ===== */
@media(max-width:640px){
  body{font-size:15px}
  input,select,textarea{font-size:16px}           /* tránh iPhone tự phóng to */
  .hwrap{padding:8px 12px} .brand{font-size:15px}
  #month{padding:5px 8px}
  nav button{padding:10px 11px;font-size:14px}
  main{padding:12px 10px 80px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px} .kpi .v{font-size:19px} .card{padding:13px}
  .mask{padding:0;align-items:stretch}
  .modal{border-radius:0;min-height:100%;padding:16px 14px 90px}
  .foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px;margin:0;z-index:5}
  .foot .btn{flex:1;padding:11px}
  .legs .leg{grid-template-columns:24px 1fr 62px 34px;gap:6px;row-gap:6px;padding-bottom:8px;border-bottom:1px dashed var(--line);margin-bottom:8px}
  .legs .leg input[data-k="to"]{grid-column:2 / -1}
  .legs .leg input[data-k="km"]{grid-column:2}
  .hwrap > label{display:none} .brand{margin-right:auto}
  .btn{padding:9px 13px}
  /* bảng thành thẻ */
  table.resp thead{display:none}
  table.resp, table.resp tbody, table.resp tr, table.resp td{display:block;width:100%}
  table.resp tr{border-bottom:8px solid var(--bg);padding:6px 4px}
  table.resp td{border:0;padding:4px 10px !important;text-align:left !important;display:flex;gap:10px;justify-content:space-between}
  table.resp td::before{content:attr(data-l);color:var(--muted);font-size:12.5px;flex:0 0 92px}
  table.resp td > *{text-align:right}
  table.resp tfoot{display:block} table.resp tfoot tr{display:flex;flex-wrap:wrap;justify-content:space-between}
  table.resp tfoot td{display:block;width:auto} table.resp tfoot td::before{content:none}
  .tw{border:0;background:none}
  table.resp tr{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
  .hide-m{display:none}
}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
      Quản lý Giao Nhận
    </div>
    <label class="muted small">Tháng</label>
    <input type="month" id="month">
  </div>
  <nav id="tabs">
    <button data-tab="dash" class="on">Tổng quan</button>
    <button data-tab="orders">Đơn hàng & lộ trình</button>
    <button data-tab="staff">Nhân viên</button>
    <button data-tab="price">Bảng giá theo km</button>
    <button data-tab="pay">Bảng lương</button>
    <button data-tab="set">Cài đặt</button>
  </nav>
</header>
<main>
  <div id="status"></div>
  <section id="v-dash"></section>
  <section id="v-orders" hidden></section>
  <section id="v-staff" hidden></section>
  <section id="v-price" hidden></section>
  <section id="v-pay" hidden></section>
  <section id="v-set" hidden></section>
</main>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= STATE ================= */
const S = { staff:[], orders:[], adjust:{}, pricing:null, places:{}, db:null, mem:false, loaded:{}, readOnly:false, dl:null };
const DEFAULT_PRICING = {
  tiers:[{from:0,to:5,rate:5000},{from:5,to:20,rate:4000},{from:20,to:null,rate:3500}],
  perTrip:10000, minTrip:20000, roundTrip:false
};
const STATUS = {
  wait:{t:"Chờ giao",c:"t-wait"}, go:{t:"Đang giao",c:"t-go"},
  done:{t:"Đã giao",c:"t-done"}, cancel:{t:"Hủy",c:"t-cancel"}
};
let TAB = "dash";
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const vnd = n => (Math.round(+n||0)).toLocaleString("vi-VN") + " đ";
const num = n => (+n||0).toLocaleString("vi-VN",{maximumFractionDigits:1});
const toN = v => { const x = parseFloat(String(v??"").replace(/\./g,"").replace(",", ".")); return isFinite(x)?x:0; };
const toKm = v => { const x = parseFloat(String(v??"").replace(",", ".")); return isFinite(x)&&x>0?x:0; };
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const month = () => $("#month").value || today().slice(0,7);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2400); }
const pricing = () => S.pricing || DEFAULT_PRICING;
const staffById = id => S.staff.find(s=>s.id===id);
const staffName = id => staffById(id)?.name || "—";

/* Tiền công theo bậc km */
function calcPay(km, p = pricing()){
  km = +km||0;
  if (km <= 0) return 0;
  let t = 0;
  const tiers = [...(p.tiers||[])].sort((a,b)=>a.from-b.from);
  for (const tr of tiers){
    const a = +tr.from||0, b = (tr.to===null||tr.to===""||tr.to===undefined) ? Infinity : +tr.to;
    if (km > a) t += (Math.min(km,b) - a) * (+tr.rate||0);
  }
  t += +p.perTrip||0;
  return Math.round(Math.max(t, +p.minTrip||0));
}
/* Google Maps links */
const MODES = {"two-wheeler":"Xe máy", "driving":"Ô tô / xe tải"};
function gmapsUrl(points, mode){
  const pts = points.map(p=>String(p||"").trim()).filter(Boolean);
  if (pts.length < 2) return "";
  const enc = encodeURIComponent;
  let u = "https://www.google.com/maps/dir/?api=1&origin="+enc(pts[0])+"&destination="+enc(pts[pts.length-1]);
  const mid = pts.slice(1,-1);
  if (mid.length) u += "&waypoints="+mid.map(enc).join("%7C");
  return u + "&travelmode="+(mode||"two-wheeler");
}
function routePoints(o){
  const P = (t, ll) => ll && isFinite(ll.lat) ? `${(+ll.lat).toFixed(6)},${(+ll.lon).toFixed(6)}` : t;
  const pts = [P(o.pickup, o.pickupLL), ...(o.legs||[]).map(l=>P(l.to, l.ll))];
  if (o.hasReturn || +o.returnKm) pts.push(P(o.pickup, o.pickupLL));
  return pts;
}
function payBreakdown(km, p = pricing()){
  km = +km||0; if (km<=0) return "";
  const parts = [];
  [...(p.tiers||[])].sort((a,b)=>a.from-b.from).forEach(tr=>{
    const a=+tr.from||0, b=(tr.to===null||tr.to===""||tr.to===undefined)?Infinity:+tr.to;
    if (km>a){ const seg=Math.round((Math.min(km,b)-a)*10)/10; if(seg>0) parts.push(`${num(seg)} km × ${(+tr.rate||0).toLocaleString("vi-VN")}đ`); }
  });
  if (+p.perTrip) parts.push(`${(+p.perTrip).toLocaleString("vi-VN")}đ/chuyến`);
  let t = parts.join(" + ");
  const raw = calcPay(km,p);
  if (+p.minTrip && raw===Math.round(+p.minTrip)) t += ` → áp mức tối thiểu ${(+p.minTrip).toLocaleString("vi-VN")}đ`;
  return t;
}
function orderKm(o){
  const legs = (o.legs||[]).reduce((s,l)=>s+(+l.km||0),0);
  return Math.round((legs + (o.returnKm? +o.returnKm||0 : 0))*10)/10;
}

/* ================= DATA LAYER ================= */
function handleErr(e){
  const c = e && e.code;
  if (c==="invalid_argument"){ S.readOnly=true; toast("Bạn chỉ có quyền xem, không lưu được thay đổi."); renderStatus(); }
  else if (c==="quota_exceeded") toast("Bộ nhớ dữ liệu đã đầy: hãy xóa bớt đơn cũ.");
  else toast("Không lưu được, vui lòng thử lại.");
}
async function put(col, id, data){
  if (S.mem){ memPut(col,id,data); return true; }
  try{ await S.db.collection(col).doc(id).set(data); return true; }
  catch(e){
    if (e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r,600+Math.random()*600)); try{ await S.db.collection(col).doc(id).set(data); return true; }catch(e2){ handleErr(e2); return false; } }
    handleErr(e); return false;
  }
}
async function del(col, id){
  if (S.mem){ memDel(col,id); return true; }
  try{ await S.db.collection(col).doc(id).delete(); return true; } catch(e){ handleErr(e); return false; }
}
const LS_KEY="giaonhan_data_v1", LS_KEY_API="giaonhan_gmaps_key";
function saveLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({staff:S.staff, orders:S.orders, adjust:S.adjust, pricing:S.pricing, places:S.places, savedAt:new Date().toISOString()})); S.localOK=true; }
  catch(e){ S.localOK=false; toast("Không lưu được vào máy! Hãy sao lưu ra file ngay."); }
}
function loadLocal(){
  try{ const raw=localStorage.getItem(LS_KEY); S.localOK=true; if(!raw) return; const d=JSON.parse(raw);
    S.staff=d.staff||[]; S.orders=d.orders||[]; S.adjust=d.adjust||{}; S.pricing=d.pricing||null; S.places=d.places||{}; }
  catch(e){ S.localOK=false; }
}
function memPut(col,id,data){
  if (col==="config"){ S.pricing = data; }
  else if (col==="adjust"){ S.adjust[id] = {...data, id}; }
  else { const arr=S[col]; const i=arr.findIndex(x=>x.id===id); const v={...data,id}; if(i>=0)arr[i]=v; else arr.push(v); }
  if (col==="staff") S.staff.sort((a,b)=>(a.code||"").localeCompare(b.code||""));
  saveLocal(); render();
}
function memDel(col,id){
  if (col==="adjust") delete S.adjust[id];
  else S[col] = S[col].filter(x=>x.id!==id);
  saveLocal(); render();
}

function subscribe(){
  const db = S.db;
  const timer = setTimeout(()=>{ if(!S.loaded.orders){ S.slow=true; renderStatus(); } }, 10000);
  const done = k => { S.loaded[k]=true; if (S.loaded.orders){ clearTimeout(timer); S.slow=false; renderStatus(); } };
  const errCb = k => e => { S.loaded[k]=true; S.err=true; renderStatus(); };
  db.collection("staff").onSnapshot(snap=>{
    S.staff = snap.docs.map(d=>({...d.data(), id:d.id})).sort((a,b)=>(a.code||"").localeCompare(b.code||""));
    if(!snap.metadata.fromCache) done("staff"); render();
  }, errCb("staff"));
  db.collection("orders").onSnapshot(snap=>{
    S.orders = snap.docs.map(d=>({...d.data(), id:d.id}));
    if(!snap.metadata.fromCache) done("orders"); render();
  }, errCb("orders"));
  db.collection("adjust").onSnapshot(snap=>{
    const m={}; snap.docs.forEach(d=>m[d.id]={...d.data(), id:d.id}); S.adjust=m;
    if(!snap.metadata.fromCache) done("adjust"); render();
  }, errCb("adjust"));
  db.doc("config/pricing").onSnapshot(snap=>{
    S.pricing = snap.exists ? snap.data() : null;
    if(!snap.metadata.fromCache) done("pricing"); render();
  }, errCb("pricing"));
}

function renderStatus(){
  let h="";
  if (S.localOK===false) h = `<div class="banner w">Trình duyệt không cho lưu dữ liệu trên máy này (có thể đang mở ở chế độ ẩn danh). Dữ liệu sẽ mất khi đóng trang. Hãy mở bằng Chrome/Edge thường và vào <b>Cài đặt → Sao lưu</b>.</div>`;
  else if (getEngine()==="google" && !getKey()) h = `<div class="banner w">Đang chọn tính km bằng Google Maps nhưng chưa có khóa. Vào tab <b>Cài đặt</b> để chuyển sang bản đồ miễn phí hoặc nhập khóa.</div>`;
  else if (S.err) h = `<div class="banner w">Không kết nối được kho dữ liệu. Dữ liệu hiển thị có thể chưa đầy đủ.</div>`;
  else if (S.slow) h = `<div class="banner w">Đang chờ tải dữ liệu… mạng có thể chậm, dữ liệu có thể chưa cập nhật.</div>`;
  if (S.readOnly) h += `<div class="banner w">Bạn đang ở quyền chỉ xem. Nhờ chủ sở hữu chia sẻ quyền “Contributor” trở lên để nhập liệu.</div>`;
  $("#status").innerHTML = h;
}

/* ================= RENDER ================= */
function render(){
  renderStatus();
  ({dash:rDash, orders:rOrders, staff:rStaff, price:rPrice, pay:rPay, set:rSet})[TAB]();
}
const monthOrders = (m=month()) => S.orders.filter(o=>(o.date||"").startsWith(m));
const doneOrders = (m=month()) => monthOrders(m).filter(o=>o.status==="done");

const QC = { from:null, to:"", out:"", res:null };
async function quickCalc(){
  QC.from = $("#qFrom").value.trim(); QC.to = $("#qTo").value.trim();
  const out = $("#qOut");
  if (!QC.from || !QC.to){ out.textContent = "Nhập cả điểm đi và điểm đến."; return; }

}

function payroll(m=month()){
  const done = doneOrders(m);
  const ids = new Set([...S.staff.filter(s=>s.active!==false).map(s=>s.id), ...done.map(o=>o.staffId).filter(Boolean)]);
  return [...ids].map(id=>{
    const s = staffById(id) || {id, name:"(NV đã xóa)", code:"", baseSalary:0};
    const my = done.filter(o=>o.staffId===id);
    const a = S.adjust[m+"_"+id] || {};
    const trips = my.reduce((x,o)=>x+(+o.pay||0),0);
    const km = my.reduce((x,o)=>x+(+o.km||0),0);
    const base = +s.baseSalary||0;
    const total = base + trips + (+a.allowance||0) + (+a.bonus||0) - (+a.deduction||0) - (+a.advance||0);
    return {s, id, n:my.length, km, trips, base, a, total, orders:my};
  }).sort((x,y)=>(x.s.code||"").localeCompare(y.s.code||""));
}

const CRC_T = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c = CRC_T[(c^b[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipStore(files){                       // files: [{name, data:string}]
  const enc = new TextEncoder(), parts=[], central=[]; let off=0;
  const d = new Date(), dt = ((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1)) & 0xFFFF, dd = (((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate()) & 0xFFFF;
  for (const f of files){
    const name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);

    const r = await searchPlaces(addr, 1);
    if (!r.length) throw new Error("NOT_FOUND:"+addr);
    const hit = {...r[0], src:"auto"}; geoCache[key]=hit; saveGeo(); return hit;
  })().finally(()=>delete geoInflight[key]);
  return geoInflight[key];
}
async function reverseName(lat, lon){
  try{ const j = await geoFetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=vi&zoom=18&lat=${lat}&lon=${lon}`);
    return j && j.display_name ? j.display_name.split(", ").slice(0,4).join(", ") : ""; }catch{ return ""; }
}
/* Điểm: {text, ll}. Ưu tiên: ghim tay > tọa độ dán vào > địa điểm đã lưu > tìm theo chữ */
async function resolvePoint(p){
  if (typeof p === "string") p = {text:p};
  if (p.ll && isFinite(p.ll.lat)) return {...p.ll, name:p.ll.name||p.text, src:p.ll.src||"pin"};
  const c = parseCoords(p.text); if (c) return {...c, name:p.text};
  const sv = savedPlace(p.text); if (sv) return sv;
  if (isShortLink(p.text)) throw new Error("SHORTLINK");
  return await geocode(p.text);
}
async function osmRoute(points){
  const geo = [];
  for (const p of points) geo.push(await resolvePoint(p));
  const coords = geo.map(g=>g.lon.toFixed(6)+","+g.lat.toFixed(6)).join(";");
  const q = "?overview=full&geometries=geojson";
  const urls = ["https://router.project-osrm.org/route/v1/driving/"+coords+q,
                "https://routing.openstreetmap.de/routed-car/route/v1/driving/"+coords+q];
  let data = null, lastErr;
  for (const u of urls){
    try{ const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),15000);
      const r = await fetch(u,{signal:ctl.signal}); clearTimeout(t);
      if(!r.ok) throw new Error("HTTP "+r.status); data = await r.json(); if (data.code==="Ok") break; data=null; }
    catch(e){ lastErr=e; }
  }
  if (!data || !data.routes || !data.routes[0]) throw new Error(lastErr ? "ROUTE_DOWN" : "NO_ROUTE");
  const rt = data.routes[0];
  return { total:rt.distance/1000, legs:(rt.legs||[]).map(l=>l.distance/1000), mode:"OSM", places:geo, geom:rt.geometry };
}

async function computeRoute(points, mode){
  if (getEngine()==="osm") return await osmRoute(points);
  const locs = points.map(p=>{ if (typeof p==="string") p={text:p}; const ll = p.ll || parseCoords(p.text) || savedPlace(p.text); return ll ? {lat:ll.lat, lng:ll.lon} : p.text; });
  await loadMaps();
  const { Route } = await google.maps.importLibrary("routes");
  const tm = mode==="driving" ? "DRIVING" : "TWO_WHEELER";
  const ck = tm+"|"+JSON.stringify(locs);
  if (kmCache[ck]) return kmCache[ck];
  const run = async (travelMode) => {
    if (getUsage() >= getLimit()) throw new Error("LIMIT");
    addUsage();
    const { routes } = await Route.computeRoutes({
      origin: locs[0], destination: locs[locs.length-1],
      intermediates: locs.slice(1,-1).map(a=>({location:a})),
      travelMode, fields:["distanceMeters","legs"], region:"vn", language:"vi"
    });
    if (!routes || !routes.length) throw new Error("NO_ROUTE");
    const r = routes[0];
    return { total:(r.distanceMeters||0)/1000, legs:(r.legs||[]).map(l=>(l.distanceMeters||0)/1000), mode:travelMode };
  };
  const withTimeout = (pr) => Promise.race([pr, new Promise((_,rej)=>setTimeout(()=>rej(new Error("TIMEOUT")),20000))]);
  let out;
  try { out = await withTimeout(run(tm)); }
  catch(e){ if (tm==="TWO_WHEELER" && !GM.authFail && String(e&&e.message)!=="TIMEOUT") out = await withTimeout(run("DRIVING")); else throw e; }
  kmCache[ck] = out; saveCache(); return out;
}
const r1 = x => Math.round(x*10)/10;
let kmSeq = 0;
const SRC_TXT = {pin:"📌 ghim trên bản đồ", coord:"📌 tọa độ", saved:"⭐ địa điểm đã lưu", auto:"🔎 tìm theo chữ, xem bản đồ để chắc chắn"};
async function autoKm(manual){
  const o = OD; if (!o) return;
  const my = ++kmSeq;
  const say = (t) => { o.kmSource = t; const st=$("#kmStatus"); if (st) st.textContent = t; };
  if (!manual && !o.addrDirty) return;
  if (getEngine()==="google" && !getKey()){ if (manual) say("Chưa có khóa Google Maps. Vào tab Cài đặt để nhập hoặc chuyển sang bản đồ miễn phí."); return; }
  const legsIdx = o.legs.map((l,i)=>({i, to:String(l.to||"").trim(), ll:l.ll})).filter(x=>x.to || x.ll);
  const pickup = {text:String(o.pickup||"").trim(), ll:o.pickupLL};
  if ((!pickup.text && !pickup.ll) || !legsIdx.length){ if (manual) say("Cần có điểm đi và ít nhất một điểm đến."); return; }
  const pts = [pickup, ...legsIdx.map(x=>({text:x.to, ll:x.ll}))];
  if (o.hasReturn) pts.push(pickup);
  say(getEngine()==="osm" ? "Đang tìm vị trí và đo quãng đường…" : "Đang tính quãng đường theo Google Maps…");
  try{
    const res = await computeRoute(pts, o.mode);
    if (OD !== o || my !== kmSeq) return;
    legsIdx.forEach((x,k)=>{ o.legs[x.i].km = r1(res.legs[k]||0); });
    if (o.hasReturn) o.returnKm = r1(res.legs[legsIdx.length]||0);
    o.addrDirty = false;
    if (res.places){   // ghi lại vị trí để hiện trên bản đồ, kéo sửa được
      const g0 = res.places[0]; if (!o.pickupLL) o.pickupLL = {lat:g0.lat, lon:g0.lon, name:g0.name, src:g0.src};
      legsIdx.forEach((x,k)=>{ const g=res.places[k+1]; if (!o.legs[x.i].ll) o.legs[x.i].ll = {lat:g.lat, lon:g.lon, name:g.name, src:g.src}; });
    }
    o._geom = res.geom || null;
    legsIdx.forEach(x=>{ const inp=document.querySelector(`[data-leg="${x.i}"][data-k="km"]`); if(inp) inp.value=o.legs[x.i].km; });
    const rin=document.querySelector('[data-o="returnKm"]'); if(rin) rin.value=o.returnKm||"";
    refreshCalc(); updateMap(true);
    if (res.mode==="OSM"){
      const lines = res.places.slice(0, o.hasReturn ? -1 : undefined).map((g,i)=>`${i===0?"Đi":"Đến "+i}: ${SRC_TXT[g.src]||""}${g.src==="auto"?"\n   → "+g.name.split(", ").slice(0,4).join(", "):""}`);
      const warn = res.places.some(g=>g.src==="auto") ? "\n⚠ Có điểm tìm theo chữ: nhìn bản đồ, nếu ghim sai chỗ thì kéo ghim tới đúng vị trí." : "";
      say(`✓ Đo được ${num(r1(res.total))} km\n`+lines.join("\n")+warn);
    } else {
      const modeTxt = res.mode==="DRIVING" ? "ô tô" : "xe máy";
      const note = (o.mode!=="driving" && res.mode==="DRIVING") ? " (khu vực không hỗ trợ xe máy, đã tính theo ô tô)" : "";
      say(`✓ Google Maps (${modeTxt}): ${num(r1(res.total))} km${note}`);
    }
  }catch(e){
    if (OD !== o || my !== kmSeq) return;
    const m = String(e && e.message || e);
    if (m==="NO_KEY") say("Chưa có khóa Google Maps.");
    else if (m==="SHORTLINK") say("Link rút gọn (maps.app.goo.gl) không đọc được tọa độ. Trong Google Maps hãy nhấn giữ vào vị trí, copy dãy số tọa độ (vd 10.77251, 106.69802) rồi dán vào. Hoặc bấm 📍 để ghim trên bản đồ.");
    else if (m==="LIMIT") say(`Đã dùng hết ${getLimit()} lượt miễn phí của tháng này. Nhập km bằng tay, sang tháng sau phần mềm tự tính lại.`);
    else if (GM.authFail) say("Khóa Google Maps bị từ chối. Kiểm tra lại ở tab Cài đặt.");
    else if (m.startsWith("NOT_FOUND:")) say(`Không tìm thấy “${m.slice(10)}”. Bấm 📍 bên cạnh rồi chạm vào đúng vị trí trên bản đồ, hoặc dán tọa độ từ Google Maps.`);
    else if (m==="GEO_DOWN"||m==="ROUTE_DOWN") say("Máy chủ bản đồ miễn phí đang bận hoặc mất mạng. Thử lại sau ít phút, hoặc nhập km bằng tay.");
    else if (m==="LOAD_FAIL"||m==="TIMEOUT") say("Không kết nối được bản đồ, kiểm tra mạng.");
    else say("Không tìm được đường đi giữa các điểm. Kiểm tra lại vị trí ghim trên bản đồ.");
  }
}

let LF = null;
function loadLeaflet(){
  if (window.L) return Promise.resolve();
  if (LF) return LF;
  LF = new Promise((res, rej)=>{
    const css = document.createElement("link"); css.rel="stylesheet"; css.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(css);
    const sc = document.createElement("script"); sc.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    sc.onload = ()=>res(); sc.onerror = ()=>{ LF=null; rej(new Error("LEAFLET")); }; document.head.appendChild(sc);
  });
  return LF;
}
let MAP = null, MAPL = null;
function pinIcon(label, color){
  return L.divIcon({className:"", iconSize:[30,30], iconAnchor:[15,30],
    html:`<div style="width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:${color};border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center"><span style="transform:rotate(45deg);color:#fff;font:700 13px system-ui">${label}</span></div>`});
}
async function initMap(){
  const el = $("#omap"); if (!el) return;
  try{ await loadLeaflet(); }catch{ el.innerHTML = '<div class="empty small">Không tải được bản đồ (kiểm tra mạng).</div>'; return; }
  if (!$("#omap") || el !== $("#omap")) return;
  if (MAP){ try{ MAP.remove(); }catch{} MAP=null; }
  const d = depotLL() || {lat:10.7769, lon:106.7009};
  MAP = L.map(el, {zoomControl:true, attributionControl:true}).setView([d.lat, d.lon], 12);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).addTo(MAP);
  MAPL = L.layerGroup().addTo(MAP);
  MAP.on("click", async ev=>{
    if (!OD || OD._pick===undefined || OD._pick===null) { toast("Bấm nút 📍 cạnh ô địa chỉ trước, rồi chạm vào bản đồ"); return; }
    await setPoint(OD._pick, ev.latlng.lat, ev.latlng.lng);
  });
  updateMap(true);
}
function pickLabel(k){ return k==="p" ? "điểm đi" : "điểm đến "+(+k+1); }
function startPick(k){
  OD._pick = k;
  document.querySelectorAll("[data-pick]").forEach(b=>b.classList.toggle("p", b.dataset.pick===String(k)));
  const h=$("#mapHint"); if(h) h.innerHTML = `<b style="color:var(--pri)">Chạm vào bản đồ để ghim ${pickLabel(k)}.</b>`;
  $("#omap")?.scrollIntoView({behavior:"smooth", block:"center"});
}
async function setPoint(k, lat, lon){
  const ll = {lat, lon, src:"pin"};
  if (k==="p"){ OD.pickupLL = ll; } else { OD.legs[+k].ll = ll; }
  OD._pick = null;
  document.querySelectorAll("[data-pick]").forEach(b=>b.classList.remove("p"));
  const h=$("#mapHint"); if(h) h.textContent = MAP_HINT;
  const inp = k==="p" ? $('[data-o="pickup"]') : $(`[data-leg="${k}"][data-k="to"]`);
  if (inp && !inp.value.trim()){
    const nm = await reverseName(lat, lon) || `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
    if (k==="p") OD.pickup = nm; else OD.legs[+k].to = nm;
    if (inp.isConnected) inp.value = nm;
  }
  ll.name = (k==="p" ? OD.pickup : OD.legs[+k].to);
  OD.addrDirty = true; updateMap(false); refreshLinks(); refreshCalc(); autoKm(true);
}
const MAP_HINT = "Kéo ghim nếu sai vị trí. Hoặc bấm 📍 cạnh ô địa chỉ rồi chạm lên bản đồ để ghim.";
function updateMap(fit){
  if (!MAP || !MAPL || !OD) return;
  MAPL.clearLayers();
  const pts = [];
  const add = (k, ll, label, color) => {
    if (!ll || !isFinite(ll.lat)) return;
    const m = L.marker([ll.lat, ll.lon], {draggable:true, icon:pinIcon(label,color)}).addTo(MAPL);
    m.on("dragend", e=>{ const p=e.target.getLatLng(); setPoint(k, p.lat, p.lng); });
    pts.push([ll.lat, ll.lon]);
  };
  add("p", OD.pickupLL, "A", "#1a8f5a");
  OD.legs.forEach((l,i)=>add(String(i), l.ll, String(i+1), "#1f6feb"));
  if (OD._geom && OD._geom.coordinates) L.geoJSON(OD._geom, {style:{color:"#1f6feb", weight:5, opacity:.75}}).addTo(MAPL);
  if (fit && pts.length) { if (pts.length===1) MAP.setView(pts[0], 15); else MAP.fitBounds(pts, {padding:[30,30]}); }
}

        });
      }catch{ toast("File không đúng định dạng sao lưu"); }
    };
    rd.readAsText(f);
  };
}

function nextCode(date){
  const pre = "DH"+(date||today()).replace(/-/g,"").slice(2);
  const n = S.orders.filter(o=>(o.code||"").startsWith(pre)).map(o=>parseInt(o.code.slice(pre.length))||0);
  return pre + String((n.length?Math.max(...n):0)+1).padStart(3,"0");
}

async function saveOrder(){
  const o = OD;
  if (!o.date){ toast("Chọn ngày giao"); return; }
  if (!o.staffId && (o.status==="done"||o.status==="go")){ toast("Chọn nhân viên giao nhận"); return; }
  const legs = o.legs.map(l=>({to:String(l.to||"").trim(), km:toKm(l.km), ...(l.ll?{ll:{lat:l.ll.lat, lon:l.ll.lon, src:l.ll.src||"pin"}}:{})})).filter(l=>l.to||l.km);
  // nhớ vị trí để lần sau giao cùng địa chỉ khỏi phải ghim lại
  const remember = (text, ll) => { text=String(text||"").trim(); if (!text || !ll || !isFinite(ll.lat) || parseCoords(text)) return; S.places[placeKey(text)] = {text, lat:ll.lat, lon:ll.lon, name:ll.name||text, at:today()}; };
  remember(o.pickup, o.pickupLL); o.legs.forEach(l=>remember(l.to, l.ll));
  if (!legs.length){ toast("Nhập ít nhất một điểm giao"); return; }
  const returnKm = o.hasReturn ? toKm(o.returnKm) : 0;
  const km = orderKm({legs, returnKm});
  const basePay = calcPay(km), extra = toN(o.extra);
  const data = { code:String(o.code||"").trim()||nextCode(o.date), date:o.date, customer:String(o.customer||"").trim(), phone:String(o.phone||"").trim(),
    pickup:String(o.pickup||"").trim(), ...(o.pickupLL?{pickupLL:{lat:o.pickupLL.lat, lon:o.pickupLL.lon, src:o.pickupLL.src||"pin"}}:{}), legs, returnKm, km, mode:o.mode||"two-wheeler", kmSource:o.kmSource||"", staffId:o.staffId||"", status:o.status||"wait",
    basePay, extra, pay:basePay+extra, fee:toN(o.fee), cod:toN(o.cod), note:String(o.note||""), updatedAt:new Date().toISOString() };
  if (o.status==="done" && !o.doneAt) data.doneAt = new Date().toISOString(); else if (o.doneAt) data.doneAt=o.doneAt;
  const id = o.id || uid();
  if (await put("orders", id, data)){ closeModal(); toast("Đã lưu đơn "+data.code); if(!S.mem) render(); }
}

/* ================= EVENTS ================= */
document.addEventListener("click", async e=>{
  if (e.target.closest("[data-stop]")) return;
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if (b.tagName==="A") e.preventDefault();

  else if (a==="edit-order"){ if(e.target.closest('[data-act="mark-done"],[data-stop]')) return; orderModal(S.orders.find(o=>o.id===id)); }
  else if (a==="mark-done"){
    e.stopPropagation(); const o=S.orders.find(x=>x.id===id); if(!o) return;
    if(!o.staffId){ toast("Đơn chưa có nhân viên, mở đơn để chọn."); return; }
    const {id:_, ...d} = o; d.status="done"; d.doneAt=new Date().toISOString();
    if (await put("orders", id, d)) toast("Đã giao "+o.code);
  }
  else if (a==="qcalc"){ b.disabled=true; await quickCalc(); b.disabled=false; }
  else if (a==="qorder"){ orderModal(null); OD.pickup=QC.from; OD.legs=[{to:QC.to, km:QC.res?QC.res.km:""}]; OD.kmSource="✓ Đã đo ở ô Tính nhanh"; drawOrder(); }
  else if (a==="pick"){ if (OD._pick===b.dataset.pick){ OD._pick=null; b.classList.remove("p"); const h=$("#mapHint"); if(h) h.textContent=MAP_HINT; } else startPick(b.dataset.pick); }
  else if (a==="auto-km"){ b.disabled=true; await autoKm(true); b.disabled=false; }
  else if (a==="save-key"){ const k=$("#apiKey").value.trim(); try{ localStorage.setItem(LS_KEY_API,k); }catch{} GM.loaded=null; toast(k?"Đã lưu khóa":"Đã xóa khóa"); rSet(); renderStatus(); }
  else if (a==="test-key"){ b.disabled=true; await testKey(); b.disabled=false; }
  else if (a==="backup"){ downloadFile(`giaonhan-saoluu-${today()}.json`, JSON.stringify({app:"giaonhan",version:1,staff:S.staff,orders:S.orders,adjust:S.adjust,pricing:S.pricing,places:S.places,exportedAt:new Date().toISOString()},null,1),"application/json"); toast("Đã tải file sao lưu"); }
  else if (a==="restore"){ $("#restoreFile").click(); }
  else if (a==="add-leg"){ OD.legs.push({to:"",km:""}); drawOrder(); const ins=document.querySelectorAll('[data-leg][data-k="to"]'); ins[ins.length-1]?.focus(); }
  else if (a==="del-leg"){ OD.legs.splice(+b.dataset.i,1); OD.addrDirty=true; drawOrder(); autoKm(false); }
  else if (a==="save-order"){ b.disabled=true; await saveOrder(); b.disabled=false; }
  else if (a==="del-order"){ const o=OD; confirmBox(`Xóa đơn ${o.code}?`, async()=>{ await del("orders", o.id); toast("Đã xóa đơn"); }); }

  else if (a==="edit-staff") staffModal(staffById(id));
  else if (a==="del-staff"){ const s=staffById(id); const n=S.orders.filter(o=>o.staffId===id).length;
    confirmBox(n?`${s.name} đã có ${n} đơn. Nên đổi sang “Đã nghỉ” thay vì xóa. Vẫn xóa?`:`Xóa nhân viên ${s.name}?`, async()=>{ await del("staff", id); toast("Đã xóa"); }); }
  else if (a==="add-tier"){ const last=PDRAFT.tiers[PDRAFT.tiers.length-1]; const from = last? (last.to ?? (last.from+10)) : 0; if(last && last.to==null) last.to=from; PDRAFT.tiers.push({from, to:null, rate:last?last.rate:3000}); rPrice(); }
  else if (a==="del-tier"){ PDRAFT.tiers.splice(+b.dataset.i,1); if(!PDRAFT.tiers.length) PDRAFT.tiers.push({from:0,to:null,rate:4000}); rPrice(); }
  else if (a==="reset-price"){ PDRAFT=null; rPrice(); }
  else if (a==="save-price"){
    const t=[...PDRAFT.tiers].sort((x,y)=>x.from-y.from);
    for(let i=0;i<t.length;i++){ if(t[i].to!=null && t[i].to<=t[i].from){ toast(`Bậc ${i+1}: “Đến km” phải lớn hơn “Từ km”`); return; } }
    const data = {tiers:t.map(x=>({from:+x.from||0, to:(x.to===null||x.to==="")?null:+x.to, rate:+x.rate||0})), perTrip:+PDRAFT.perTrip||0, minTrip:+PDRAFT.minTrip||0, depot:String(PDRAFT.depot||""), mode:PDRAFT.mode||"two-wheeler", updatedAt:new Date().toISOString()};
    if (await put("config","pricing",data)){ PDRAFT=null; toast("Đã lưu bảng giá"); rPrice(); }
  }
  else if (a==="recalc"){
    const list = monthOrders();
    if(!list.length){ toast("Tháng này chưa có đơn"); return; }
    confirmBox(`Tính lại tiền công cho ${list.length} đơn của tháng ${month().split("-").reverse().join("/")} theo bảng giá đã lưu?`, async()=>{
      let n=0; for(const o of list){ const {id:oid,...d}=o; const bp=calcPay(orderKm(o)); if(bp===o.basePay && (+o.pay===bp+(+o.extra||0))) continue; d.basePay=bp; d.pay=bp+(+o.extra||0); if(await put("orders",oid,d)) n++; else break; }
      toast(`Đã cập nhật ${n} đơn`);
    });
  }
  else if (a==="pay-detail") payDetail(id);
  else if (a==="copy-pay") copy(toTSV(payCSV(month())));
  else if (a==="xlsx-pay"){ try{ exportPayrollXlsx(month()); toast("Đã xuất file Excel"); }catch(err){ console.error(err); toast("Không xuất được file Excel"); } }
  else if (a==="dl-pay"){
    downloadFile(`bang-luong-${month()}.csv`, toCSV(payCSV(month())), "text/csv;charset=utf-8");
  }
});
$("#tabs").addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  TAB=b.dataset.tab; document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll("main section").forEach(s=>s.hidden = s.id!=="v-"+TAB);
  if (TAB==="price") PDRAFT=null;
  try{ location.hash = TAB; }catch{}
  render();
});
$("#month").value = today().slice(0,7);
$("#month").onchange = render;
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); if(e.key==="Enter" && (e.target.id==="qFrom"||e.target.id==="qTo")) quickCalc(); });

/* ================= INIT ================= */
(function initHash(){ const h=(location.hash||"").slice(1); const b=document.querySelector(`#tabs button[data-tab="${h}"]`); if(b) b.click(); })();
S.mem=true; S.dl=true; loadLocal(); render();
</script>
