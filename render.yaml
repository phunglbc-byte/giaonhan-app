services:
  - type: web
    name: giaonhan-express
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    disk:
      name: giaonhan-data
      mountPath: /app/data
      sizeGB: 1
